# SMTP settings for mail-message notifications (Gmail).
# When a message is sent in the app, a matching real email is best-effort
# forwarded to the recipient's address. The app still works when email is blank.
# For Gmail you must enable 2-factor authentication and create an "App Password"
# (https://myaccount.google.com/apppasswords) -- the normal account password will not work.
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.from=
mail.username=
mail.password=